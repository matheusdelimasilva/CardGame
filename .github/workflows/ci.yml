name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cardgame
          POSTGRES_PASSWORD: cardgame-ci
          POSTGRES_DB: cardgame_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardgame -d cardgame_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://cardgame:cardgame-ci@localhost:5432/cardgame_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: node --test tools/songs/brazil/*.node-test.mjs
      - run: pnpm build
